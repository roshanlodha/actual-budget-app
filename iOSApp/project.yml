name: ActualAccounts
options:
  minimumXcodeGenVersion: 2.39.0
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    # The top-level team ID can be empty
    DEVELOPMENT_TEAM: ""

schemes:
  ActualAccounts:
    build:
      targets:
        ActualAccounts: all
    run:
      config: Debug
      debugEnabled: false
  ActualAccountsMac:
    build:
      targets:
        ActualAccountsMac: all
    run:
      config: Debug
      debugEnabled: false

targets:
  ActualAccounts:
    type: application
    platform: iOS
    configFiles:
      Debug: Resources/Version.xcconfig
      Release: Resources/Version.xcconfig
    sources:
      - path: App
      - path: Features
      - path: UI
      - path: Resources
        excludes: [README.md]
      - path: Shared
      - path: Data
    info:
      path: Resources/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roshanlodha.actual.accounts
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGN_ENTITLEMENTS: Resources/ActualAccounts.entitlements
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: $(MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)

  ActualAccountsMac:
    type: application
    platform: macOS
    configFiles:
      Debug: Resources/Version.xcconfig
      Release: Resources/Version.xcconfig
    sources:
      - path: App
      - path: Features
      - path: UI
      - path: Resources
        excludes: [README.md, Info.plist, ActualAccounts.entitlements]
      - path: Shared
      - path: Data
    info:
      path: Resources/InfoMac.plist
      properties:
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roshanlodha.actual.accounts.mac
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        INFOPLIST_FILE: Resources/InfoMac.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: $(MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)


