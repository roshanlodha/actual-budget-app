apiVersion: ssu/v1
nlu:
  shortcuts:
    bundleIdentifier: com.actual.accounts
    intents:
    - metadata:
        name: AddTransactionIntent_0
        title: Add New Transaction
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Add a transaction in ${+applicationName}'
    - metadata:
        name: +negative
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }${+standardAppShortcutNegatives}'
variables:
- name: +applicationName
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
    - ActualAccounts
- name: +prefix
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/prefix/en.yaml
- name: +standardAppShortcutNegatives
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/standardAppShortcutNegatives/en.yaml
